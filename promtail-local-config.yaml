server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: ./tmp/positions.yaml # Keeps track of where it left off in the log file

clients:
  - url: http://localhost:3100/loki/api/v1/push # Sending logs to Loki

scrape_configs:
  - job_name: fastapi-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi-server
          __path__: /Users/sangdo/Documents/tmp/promtail/*.log # CHANGE THIS