global:
  scrape_interval: 5s     # How often to pull metrics from targets (default is 1m)
  evaluation_interval: 5s # How often to evaluate alerting rules

# A scrape configuration containing exactly one endpoint to monitor:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "fastapi-backend"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      # This is where your FastAPI app is running. 
      - targets: ["127.0.0.1:8000"]
        labels:
          env: "development"
          team: "student-group-1"